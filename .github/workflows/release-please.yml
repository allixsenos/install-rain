# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# docs: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: 🚀 Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5 # docs: <https://github.com/googleapis/release-please-action>
        id: release

      # a release made with GITHUB_TOKEN does not trigger other workflows, so the tags move here
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
      - name: Update major and minor git tags # Reason: <https://github.com/actions/toolkit/blob/master/docs/action-versioning.md#recommendations>
        if: ${{ steps.release.outputs.release_created }}
        env:
          SHA: ${{ steps.release.outputs.sha }}
          MAJOR: v${{ steps.release.outputs.major }}
          MINOR: v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}
        run: |
          git config --local user.email 'actions@github.com'
          git config --local user.name 'github-actions[bot]'
          git tag -fa "$MAJOR" -m "Update $MAJOR tag (using GitHub actions)" "$SHA"
          git tag -fa "$MINOR" -m "Update $MINOR tag (using GitHub actions)" "$SHA"
          git push --force origin "$MAJOR" "$MINOR"
